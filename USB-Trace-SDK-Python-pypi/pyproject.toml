[build-system]
requires=["setuptools>=77","wheel>=0.43"]
build-backend="setuptools.build_meta"
[project]
name="usb-trace-sdk"
version="1.0.0"
description="Windows x64 USB-Trace-SDK direct SDK"
requires-python=">=3.10"
license="MIT"
readme="README.md"
[project.urls]
Repository="https://github.com/titanfyre/USB-Trace-SDK"
[tool.setuptools]
packages=["usb_trace_sdk"]
[tool.setuptools.package-data]
usb_trace_sdk=["*.dll"]
[tool.setuptools.data-files]
"share/usb-trace-sdk/docs"=["docs/*","LICENSE"]
